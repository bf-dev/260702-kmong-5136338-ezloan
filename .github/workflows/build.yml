name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Import smoke
        run: python -c "import config, chrome_provisioner, browser, naver_login, ezloan_bot, bridge, captcha_dialog, session_store, updater, app; print('imports ok')"

      # 2026-07-27 gotcha: windows-latest 의 기본 셸(pwsh)은 여러 줄짜리 run: 블록에서 앞선
      # python 명령이 non-zero 로 죽어도 다음 줄로 계속 진행하고, 스텝의 성공/실패는 '마지막'
      # 명령의 종료코드만 본다. v2.5.0 빌드에서 실제로 이렇게 verify_247.py 가 AssertionError
      # 로 죽었는데도 다음 줄(repro_frontier_runaway.py)이 성공해 스텝 전체가 초록으로 보였다
      # (조용한 회귀-검증 실패 - CI 는 초록인데 실제로는 검증이 하나 죽어있었다). 스텝을 하나씩
      # 쪼개 각자 독립적으로 실패하게 만든다.
      - name: Verify 24/7 gating + amount threading (no regression)
        env:
          PYTHONIOENCODING: utf-8   # Windows 콘솔 cp1252 에서 한국어 print 크래시 방지
        run: python verify_247.py

      - name: Verify frontier-runaway protection (no regression)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_frontier_runaway.py

      - name: Verify register hot-path latency (no regression)
        env:
          PYTHONIOENCODING: utf-8
        run: python verify_register_latency.py

      - name: Verify post_absent race is retried, not permanently skipped (2026-07-27 fix)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_post_absent_race.py

      - name: Verify post_absent fast-retry/backoff (2026-07-27 v2.5.2, no speed regression)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_post_absent_backoff.py

      - name: Verify post_absent GIVEUP does not permanently block a later-real post (2026-07-27, post=30834 live bug)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_post_absent_giveup_then_real.py

      - name: Verify fast/heavy tick split cuts detection latency without losing new posts (2026-07-28, v2.5.5)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_frontier_fast_tick.py

      # 2026-08-05 (v2.6.0): 실제 운영 상태(새 글이 7~80분 간격으로 뜨는 대기 구간)에서
      # 새 글 등장 -> rq_addbanner 발사까지의 지연을 잰다. v2.5.5 는 감지기로 '쓰기'를 쓰다
      # 백오프에 묶여 1.4~5.7초씩 늦었다(이 스크립트는 v2.5.5 코드에서 실제로 실패한다).
      - name: Verify steady-state detection lag is tick-bounded (2026-08-05, v2.6.0)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_steady_state_detect_lag.py

      # 2026-08-23 (v2.6.1): 2026-08-22 사고 재현. 사이트가 42초 죽었을 때(521 x5 ->
      # ReadTimeout, 그 사이 Cloudflare 가 캐시된 옛 목록을 200 으로 대신 내려줌) 등록
      # 스레드가 죽으면 안 된다. v2.6.0 이하에서는 실제로 실패한다(session_expired 를 쏘고
      # run() 이 빠져나가 회복 후의 새 글을 등록하지 못한다).
      - name: Verify a site outage does not kill the worker (2026-08-22 incident)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_site_outage_no_session_kill.py

      # 2026-08-23 (v2.6.1): 재시작 중에 올라온 글을 영구히 건너뛰던 버그(2026-08-05 실측
      # 배너 누락 10건)의 게이트. v2.6.0 이하에서는 0건 등록으로 실패한다.
      - name: Verify posts published during a restart are not skipped (2026-08-05 open bug)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_restart_missed_posts.py

      # 라이브 재현(글 32005, 2026-08-23): 이지론은 글 번호를 먼저 채번해 페이지를 부분적으로
      # 서빙하고 배너 등록은 18.4초 뒤에 열린다. 그 창의 'no permission' 을 계정 거부로 오해해
      # seen 처리 + 프런티어 전진 -> 그 글을 통째로 잃었다. v2.6.2 이하에서는 첫 사이클에 실패.
      - name: Verify a not-yet-open new post is not given up on ('no permission' timing window)
        env:
          PYTHONIOENCODING: utf-8
        run: python repro_no_permission_not_open_yet.py

      - name: Verify login resilience (TimeoutException retries, no crash)
        env:
          PYTHONIOENCODING: utf-8
        run: python verify_login_resilient.py

      - name: Verify error-page detector (no false-positive on real login page)
        env:
          PYTHONIOENCODING: utf-8
        run: python verify_error_page_detector.py

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole
          --name "이지론배너자동등록"
          --collect-all selenium
          main.py

      - name: GUI construct self-test and Windows screenshot
        shell: pwsh
        run: |
          $env:DIAG_AUTO = "1"
          $env:DIAG_SCREENSHOT = "$PWD\windows-verification.png"
          # 이 셀프테스트는 App 을 실제로 생성하므로 app_started / auto_update_disabled 가
          # Artifacts API 로 진짜 업로드된다(그래서 'no network' 이 아니다). 기본 source 를
          # 그대로 두면 'ezloan-desktop-v<ver>' 로 올라가 고객 PC 가 프로그램을 켠 것과
          # 구분이 되지 않는다. 2026-08-23 에 바로 이것 때문에 '계정에 두 번째 세션이
          # 붙은 것 아닌가' 를 실제로 조사했다(빌드 9회 = app_started 9회로 확정).
          # CI 실행은 언제나 자기 이름으로 올라오게 고정한다.
          $env:EZLOAN_REMOTE_SOURCE = "ezloan-ci-selftest"
          $process = Start-Process -FilePath "dist\이지론배너자동등록.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows executable self-test failed: $($process.ExitCode)" }
          if (-not (Test-Path "$PWD\windows-verification.png")) { throw "Windows screenshot was not created" }

      - name: Upload Windows verification screenshot
        continue-on-error: true   # 아티팩트 저장 용량이 차도(quota) 릴리스 배포는 계속 진행
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: windows-verification.png

      - name: Verify exe file type
        shell: bash
        run: file dist/*.exe

      - name: Upload artifact
        continue-on-error: true   # 아티팩트 저장 용량이 차도(quota) 릴리스 배포는 계속 진행
        uses: actions/upload-artifact@v4
        with:
          name: ezloan-exe
          path: dist/*.exe

      - name: Publish release (versioned ASCII asset name; never overwrite a served filename)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Select-String -Path config.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # 자동 업데이트가 받는 파일명은 항상 버전 접미사(ezloan-desktop-<ver>.exe)로만 배포한다.
          # (이미 서빙 중인 파일명을 덮어쓰면 Cloudflare 엣지 캐시가 옛 바이트를 내보내 재시작 루프 발생)
          Copy-Item "dist\이지론배너자동등록.exe" "dist\ezloan-desktop-$ver.exe"
          gh release upload latest "dist\ezloan-desktop-$ver.exe" --clobber
          if ($LASTEXITCODE -ne 0) { gh release create latest "dist\ezloan-desktop-$ver.exe" --title latest --notes "auto build v$ver" }
